<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Ecommerce</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <div class="ecommerce-layout">
        
        <header class="main-header">
            <h1 class="h5 mb-0 text-white fw-medium">Mi Ecommerce</h1>
        </header>

        <aside class="categories-sidebar">
            <h2 class="h6 fw-bold mb-3 text-dark">Categorías</h2>
            <ul class="list-unstyled categories-list">
                <li><a href="#">Perfumes <span class="text-muted">(13)</span></a></li>
                <li><a href="#">Ropa <span class="text-muted">(21)</span></a></li>
                <li><a href="#">Accesorios <span class="text-muted">(41)</span></a></li>
                <li><a href="#">Zapatos <span class="text-muted">(10)</span></a></li>
            </ul>
        </aside>

        <main class="products-container">
            
            <article class="product-card">
                <div class="product-img-box">
                    <img src="assets/img/Perfume myKingdom.avif" alt="Perfume myKingdom">
                </div>
                <div class="product-body">
                    <h3 class="product-title">Perfume myKingdom</h3>
                    <p class="product-price">31.400</p>
                    <button class="btn-buy">Comprar</button>
                </div>
            </article>

            <article class="product-card">
                <div class="product-img-box">
                    <img src="assets/img/PACORABANNEPHANTOM.webp" alt="Perfume Phantom">
                </div>
                <div class="product-body">
                    <h3 class="product-title">Perfume Phantom</h3>
                    <p class="product-price">68.900</p>
                    <button class="btn-buy">Comprar</button>
                </div>
            </article>

            <article class="product-card">
                <div class="product-img-box">
                    <img src="assets/img/Zapatos Docker.webp" alt="Zapatos Docker">
                </div>
                <div class="product-body">
                    <h3 class="product-title">Zapatos Docker</h3>
                    <p class="product-price">29.700</p>
                    <button class="btn-buy">Comprar</button>
                </div>
            </article>

            <article class="product-card">
                <div class="product-img-box">
                    <img src="assets/img/Poleron Puma.jpg" alt="Poleron Puma">
                </div>
                <div class="product-body">
                    <h3 class="product-title">Poleron Puma</h3>
                    <p class="product-price">44.700</p>
                    <button class="btn-buy">Comprar</button>
                </div>
            </article>

        </main>

        <footer class="main-footer">
            <span class="text-muted small">@miecommerce</span>
        </footer>

    </div>

</body>
</html>
